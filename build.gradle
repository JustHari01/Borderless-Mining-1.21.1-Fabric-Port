plugins {
    id 'fabric-loom' version '1.8.13'
}

group = project.maven_group
version = project.mod_version
archivesBaseName = project.archives_base_name

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    def resourceLoader = fabricApi.module('fabric-resource-loader-v0', project.fabric_version)
    modImplementation resourceLoader
    include resourceLoader

    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
        exclude(group: 'net.fabricmc.fabric-loader')
    }
}

loom {
    accessWidenerPath = file('src/main/resources/borderlessmining.accesswidener')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "LICENSE_${project.archives_base_name}" }
    }
}
